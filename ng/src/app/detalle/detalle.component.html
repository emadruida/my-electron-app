<div>
  @if (cliente.isLoading()) {
    <p>Cargando...</p>
  } @else if (cliente.error()) {
    <p>Error al cargar el cliente.</p>
  } @else {
    <div>
      <label for="id">Id</label>
      <input id="id" readonly [(ngModel)]="cliente.value()!.id" />
    </div>
    <div>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" [(ngModel)]="cliente.value()!.nombre" />
    </div>
    <div>
      <label for="apellidos">Apellidos</label>
      <input type="text" id="apellidos" [(ngModel)]="cliente.value()!.apellidos" />
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="cliente.value()!.email" />
    </div>
    <div>
      <button (click)="guardar()">Guardar</button>
    </div>
  }
</div>
